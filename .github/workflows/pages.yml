# Builds the static app and publishes it to GitHub Pages (Settings → Pages → Source: GitHub Actions).
# The Node fetch service is not available there, so recipes and products are imported by pasting page HTML.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build
        run: npm run build
        env:
          # e.g. /MealPlanner/ for a project site, / for a custom domain
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          VITE_STATIC_ONLY: 'true'
      # Pages has no SPA rewrites: serve the app for deep links like /reseptit/abc too.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
